# Per-user config for podman nested inside this container.
# Copied from containers/image_build@b86020d8c306c4724780adfb6fc492d0a2d9cc48
# (podman/podman-containers.conf).
#
# The outer container's /proc is partly masked, so a fresh procfs mount
# fails. Bind the existing one instead.
[containers]
volumes = [
	"/proc:/proc",
]
default_sysctls = []
