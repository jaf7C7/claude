# System-wide config for podman nested inside this container.
# Copied from containers/image_build@b86020d8c306c4724780adfb6fc492d0a2d9cc48
# (podman/containers.conf).
#
# Share the outer container's namespaces and skip cgroups, which a
# rootless container can't delegate.
[containers]
netns="host"
userns="host"
ipcns="host"
utsns="host"
cgroupns="host"
cgroups="disabled"
log_driver = "k8s-file"
[engine]
cgroup_manager = "cgroupfs"
events_logger="file"
runtime="crun"
